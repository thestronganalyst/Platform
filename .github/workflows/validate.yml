name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Contract tests
        run: pytest
      - name: Validate every example manifest
        run: |
          set -e
          for m in examples/*/platform.yaml; do
            echo "== $m"
            platform validate "$m"
          done
      - name: Catalog
        run: |
          platform list modules
          platform list interfaces
