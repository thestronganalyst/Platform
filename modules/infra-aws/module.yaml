# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: infra-aws
version: 0.1.0
layer: foundation
status: planned
drift: platform-owned
hosting:
- aws
platforms: []
provides:
- infra.network@1
- infra.db.postgres@1
- infra.container@1
- infra.cdn@1
- infra.object-store@1
- infra.secrets@1
requires: []
optional: []
config:
  region:
    type: string
    default: us-east-1
    description: AWS region for every stack
  db_size:
    type: string
    default: small
    enum:
    - small
    - medium
    - large
    description: RDS instance class bucket; mapped to an instance type in the construct
  runtime:
    type: string
    default: app-runner
    enum:
    - app-runner
    - fargate
    description: Container runtime for infra.container (pending ADR)
source: AveHealth
summary: 'The AWS foundation every aws-tier app deploys onto: network, Postgres, a container runtime,
  CDN, object storage and secrets, as one CDK stack per environment.'
