# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: infra-aws
version: 0.3.0
layer: foundation
status: incubating
drift: platform-owned
hosting:
- aws
platforms: []
provides:
- infra.network@1
- infra.db.postgres@1
- infra.container@1
- infra.cdn@1
- infra.object-store@1
- infra.secrets@1
- infra.security-baseline@1
requires: []
optional: []
config:
  region:
    type: string
    default: us-east-1
    description: AWS region for every stack
  account:
    type: string
    default: ''
    description: 'If set (quote it: "123456789012"), refuse to build for any other account'
  db_size:
    type: string
    default: small
    enum:
    - small
    - medium
    - large
    description: 'Aurora Serverless v2 capacity: small 0-2 ACU and pauses when idle, medium 0.5-4, large 1-16'
  runtime:
    type: string
    default: lambda
    enum:
    - lambda
    description: 'API runtime: the API container image on Lambda behind API Gateway'
  nat_gateways:
    type: integer
    default: 1
    description: 'NAT gateways (0-2). 0 removes the biggest fixed cost but the app subnets lose outbound internet'
  guardduty:
    type: boolean
    default: true
    description: Create a GuardDuty detector (set false if the account already has one in this region)
  cloudtrail:
    type: boolean
    default: true
    description: Create a multi-region CloudTrail trail with its own bucket
  bastion:
    type: boolean
    default: true
    description: An SSM-only t4g.nano for migrations; stop it between sessions
  deletion_protection:
    type: boolean
    default: true
    description: 'Keep data stores when stacks are deleted; false lets a throwaway app tear down cleanly'
source: AveHealth
summary: 'The AWS foundation every aws-tier app deploys onto, in your own account: VPC, Aurora Serverless
  v2 Postgres, the API image on Lambda behind API Gateway, S3 + CloudFront, object storage, secrets and
  a security baseline (CloudTrail, GuardDuty, flow logs, KMS keys, an alarms topic).'
