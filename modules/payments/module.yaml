# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: payments
version: 0.1.0
layer: capability
status: planned
drift: platform-owned
hosting:
- aws
platforms:
- api
- web
provides:
- payments.account@1
- payments.charge@1
- payments.payout@1
- payments.receipt@1
requires:
- tenancy.org@1
- identity.user@1
- obs.audit@1
- infra.db.postgres@1
- infra.secrets@1
optional:
- notify.send@1
config:
  connect_type:
    type: string
    default: express
    enum:
    - express
    - standard
    - custom
    description: Stripe Connect account type (pending ADR)
  platform_fee_bps:
    type: integer
    default: 0
    description: Platform fee in basis points, 0 = none
source: softball
incubates_in: softball
summary: 'Stripe Connect: money moves to a team''s or league''s own account, not to you. Charges, payouts
  and receipts, all audited.'
