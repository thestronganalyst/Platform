# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: web-shell
version: 0.2.0
layer: foundation
status: planned
drift: forked
hosting:
- aws
- free
platforms:
- web
provides:
- web.shell@1
- web.route-registry@1
- web.role-nav@1
- web.theme@1
requires: []
optional:
- identity.session@1
- identity.roles@1
- infra.cdn@1
- infra.static-host@1
config:
  pwa:
    type: boolean
    default: true
    description: Ship a service worker and manifest
  theme:
    type: string
    default: default
    description: Named theme token set
source: AveHealth
summary: 'The React PWA frame (Vite, React 19, TypeScript, Tailwind 4, React Router, TanStack Query, Amplify
  Auth): layout, routing, role-aware navigation, theming, error boundary. Forked on generate because every
  app restyles it.'
