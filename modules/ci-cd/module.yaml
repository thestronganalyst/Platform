# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: ci-cd
version: 0.3.0
layer: foundation
status: incubating
drift: platform-owned
hosting:
- aws
- free
platforms: []
provides:
- ci.pipeline@1
requires: []
optional:
- infra.container@1
- infra.static-host@1
- infra.cdn@1
config:
  branch:
    type: string
    default: main
    description: Branch that deploys to prod
  github_repo:
    type: string
    default: ''
    description: 'owner/repo allowed to deploy through the OIDC role; empty creates no role'
  oidc_provider:
    type: string
    default: create
    enum:
    - create
    - import
    description: 'Create the GitHub OIDC provider, or import it when the account already has one'
source: AveHealth
summary: GitHub Actions deploys through an OIDC role scoped to one repository and branch; workflow templates
  for publishing the web app.
