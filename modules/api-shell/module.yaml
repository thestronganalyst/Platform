# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: api-shell
version: 0.2.0
layer: foundation
status: planned
drift: platform-owned
hosting:
- aws
platforms:
- api
provides:
- api.router@1
- api.auth-middleware@1
- api.errors@1
requires:
- infra.db.postgres@1
- infra.container@1
optional:
- identity.session@1
- obs.logs@1
config:
  framework:
    type: string
    default: fastapi
    enum:
    - fastapi
    description: Python 3.12, FastAPI, SQLAlchemy 2, Alembic, Pydantic 2; Mangum adapts it to Lambda
source: AveHealth
summary: 'The API process: FastAPI with SQLAlchemy and Alembic on Python 3.12, run on Lambda through Mangum.
  Routing, auth middleware, error envelope, health endpoint, database session.'
