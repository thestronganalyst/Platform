# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: observability
version: 0.2.0
layer: foundation
status: planned
drift: platform-owned
hosting:
- aws
- free
platforms:
- api
- web
provides:
- obs.logs@1
- obs.errors@1
- obs.audit@1
requires:
- infra.db.postgres@1
optional:
- infra.container@1
- infra.security-baseline@1
config:
  audit_retention_days:
    type: integer
    default: 365
    description: How long audit events are kept
source: AveHealth
summary: Structured logs, error capture and an append-only audit stream. consent-sharing and anything
  health- or money-adjacent writes to the audit stream.
