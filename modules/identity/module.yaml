# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: identity
version: 0.3.0
layer: capability
status: incubating
drift: platform-owned
hosting:
- aws
- free
platforms:
- api
- web
- mobile
provides:
- identity.user@1
- identity.session@1
- identity.roles@1
requires:
- infra.db.postgres@1
optional:
- infra.secrets@1
- infra.container@1
config:
  providers:
    type: array
    default:
    - email
    description: 'Login providers: email (built), google and apple (not built yet)'
  mfa:
    type: string
    default: optional
    enum:
    - 'off'
    - optional
    - required
    - passkey
    description: 'Second factor (authenticator app): off, optional, required. passkey is not built on
      the aws tier yet'
  signup:
    type: string
    default: invite-only
    enum:
    - invite-only
    - open
    description: 'Invite-only: accounts are created on someone''s behalf, never by self sign-up'
  roles:
    type: array
    default:
    - admin
    - member
    description: App-level roles, one Cognito group each; org roles live in tenancy
  deletion_protection:
    type: boolean
    default: true
    description: Keep the user pool when stacks are deleted; false lets a throwaway app tear down
source: AveHealth
summary: Login, sessions and roles. Cognito on the aws tier, Supabase Auth on the free tier, one interface
  either way. Invite-only by default.
