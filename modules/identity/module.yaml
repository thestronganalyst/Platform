# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: identity
version: 0.2.0
layer: capability
status: planned
drift: platform-owned
hosting:
- aws
- free
platforms:
- api
- web
- mobile
provides:
- identity.user@1
- identity.session@1
- identity.roles@1
requires:
- infra.db.postgres@1
optional:
- infra.secrets@1
config:
  providers:
    type: array
    default:
    - email
    description: 'Login providers: email, google, apple'
  mfa:
    type: string
    default: optional
    enum:
    - 'off'
    - optional
    - required
    - passkey
    description: 'Second factor: `passkey` means a passkey is the only one that counts (aws tier; free
      tier to be confirmed)'
  signup:
    type: string
    default: invite-only
    enum:
    - invite-only
    - open
    description: 'Invite-only: accounts are created on someone''s behalf, never by self sign-up'
source: AveHealth
summary: Login, sessions and roles. Cognito on the aws tier, Supabase Auth on the free tier, one interface
  either way. Invite-only by default.
