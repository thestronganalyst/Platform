# Module declaration. Schema: ../../schemas/module.schema.json
# Interfaces are domain.name@major; depend on interfaces, never on module names.
name: offline-sync
version: 0.1.0
layer: capability
status: planned
drift: platform-owned
hosting:
- aws
platforms:
- mobile
- web
provides:
- sync.store@1
requires:
- api.router@1
optional: []
config:
  conflict_policy:
    type: string
    default: event-log
    enum:
    - event-log
    - last-write-wins
