[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "platform-cli"
version = "0.1.0"
description = "Validate, plan and generate apps from the platform module catalog."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
platform = "platform_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["platform_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
