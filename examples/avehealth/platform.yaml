# AveHealth-shaped RPM app — first consumer; modules are extracted from it.
app: avehealth
preset: rpm-app
hosting: aws
modules:
  remove: []
  add: []
config:
  identity.providers: [email]
  identity.mfa: passkey               # a passkey is the only second factor that counts
  identity.signup: invite-only        # admin → provider → patient
  profiles.managed: true              # caregivers acting for a patient
  tenancy.levels: [practice, panel]
  consent-sharing.categories: [basic, health]
  consent-sharing.default_posture: deny
  notifications.channels: [email, push]
environments: [prod]
